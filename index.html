<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cómo avanzó la IA</title>
<meta name="description" content="Línea temporal educativa del avance de la inteligencia artificial, de ChatGPT (2022) a hoy: no solo modelos más grandes, también post-entrenamiento, razonamiento, herramientas y agentes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #8da0fb;
  --purple: #b88ff4;
  --lilac: #e1e2fe;
  --yellow: #fbc77a;
  --cream: #fffaed;
  --ink: #280b3c;
  --ink-soft: rgb(40 11 60 / 0.72);
  --ease-bubble: cubic-bezier(0.32, 0.94, 0.6, 1);
  --header-h: 112px;
  --footer-h: 74px;
  --b: 140px;
  font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--ink);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: linear-gradient(100deg, #8da0fb 0%, #b88ff4 18%, #f0a9c9 38%, #fbc77a 55%, #b8d8c8 72%, #8da0fb 88%, #b88ff4 100%);
  background-size: 400% 100%;
  background-position: 0% 50%;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: inherit; }

/* ---------- Parallax background ---------- */
.bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.bg-layer { position: absolute; top: 0; left: 0; height: 100%; }
.star { position: absolute; width: 4px; height: 4px; border-radius: 1px; background: #fff; opacity: .7; }
.star.warm { background: var(--yellow); }
.star.pink { background: #ff94b6; }
.cloud { position: absolute; }
.cloud svg { display: block; width: 100%; height: auto; }

/* ---------- Header ---------- */
header {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 18px 24px 0;
  pointer-events: none;
}
header > * { pointer-events: auto; }
.brand .eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.brand h1 { margin: 2px 0 0; font-size: clamp(1.4rem, 2.6vw, 2.1rem); font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill {
  display: inline-flex; align-items: center; gap: .5rem;
  border: 0; border-radius: 999px; padding: .7rem 1.2rem;
  background: var(--cream); color: var(--ink); font-weight: 500; line-height: 1;
  cursor: pointer; box-shadow: 0 6px 20px rgb(40 11 60 / 0.10);
  transition: transform .3s var(--ease-bubble), background-color .3s;
}
.pill:hover { transform: scale(1.04); background: var(--lilac); }
.pill:focus-visible, .bubble:focus-visible, .chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--cream); }

.legend {
  position: fixed; z-index: 20; left: 24px; right: 24px; top: 70px;
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px;
}
.legend::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  border: 0; border-radius: 999px; padding: .38rem .8rem .38rem .45rem;
  background: rgb(255 250 237 / 0.78); backdrop-filter: blur(6px);
  font-size: .82rem; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color .25s, opacity .25s, transform .25s var(--ease-bubble);
}
.chip:hover { transform: translateY(-1px); background: var(--cream); }
.chip .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--c); display: grid; place-items: center; }
.chip .dot svg { width: 12px; height: 12px; stroke: #fff; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.legend.filtering .chip[aria-pressed="false"] { opacity: .6; }

/* ---------- Horizontal scroller ---------- */
#scroller {
  position: fixed; inset: 0; z-index: 5;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; cursor: grab;
  overscroll-behavior-x: contain;
}
#scroller::-webkit-scrollbar { display: none; }
#scroller.dragging { cursor: grabbing; user-select: none; }
#track { position: relative; height: 100%; }
#line-svg { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

.year-ghost {
  position: absolute; font-weight: 800; letter-spacing: -.04em; line-height: 1;
  color: rgb(255 255 255 / 0.28); pointer-events: none; user-select: none;
  transform: translate(-10%, -50%);
}

/* Intro and end panels */
.panel {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgb(255 250 237 / 0.92); backdrop-filter: blur(10px);
  border-radius: 28px; padding: 28px 30px; box-shadow: 0 20px 50px rgb(40 11 60 / 0.14);
  cursor: auto;
}
.panel h2 { margin: 0 0 10px; font-size: clamp(1.6rem, 3vw, 2.4rem); line-height: 1.02; letter-spacing: -.02em; font-weight: 800; }
.panel p { margin: 0 0 12px; line-height: 1.45; color: var(--ink-soft); }
.panel .kicker { font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); opacity: .7; margin-bottom: 8px; }
.levers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 14px 0 16px; padding: 0; list-style: none; }
.levers li { display: flex; gap: 8px; align-items: flex-start; font-size: .86rem; line-height: 1.25; }
.levers .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--c); display: grid; place-items: center; margin-top: 1px; }
.levers .dot svg { width: 13px; height: 13px; stroke: #fff; }
.levers b { display: block; font-weight: 700; color: var(--ink); }
.levers span { color: var(--ink-soft); }
.hint { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: .92rem; }
.hint .arrow { display: inline-block; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(6px); } }
.takeaways { margin: 8px 0 14px; padding-left: 1.1rem; line-height: 1.4; color: var(--ink-soft); }
.takeaways li { margin-bottom: 6px; }
.takeaways b { color: var(--ink); }
.note { font-size: .8rem; opacity: .85; }

/* Era cards */
.era {
  position: absolute; width: 300px; transform: translate(-50%, -50%);
  background: var(--ink); color: var(--cream); border-radius: 24px; padding: 18px 20px;
  box-shadow: 0 18px 40px rgb(40 11 60 / 0.25); cursor: auto;
}
.era .num { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--yellow); }
.era h3 { margin: 4px 0 6px; font-size: 1.35rem; line-height: 1.05; letter-spacing: -.01em; }
.era .range { font-size: .8rem; opacity: .7; margin-bottom: 8px; }
.era p { margin: 0; font-size: .88rem; line-height: 1.4; opacity: .9; }

/* Milestone bubbles */
.ms { position: absolute; width: 0; height: 0; }
.bubble {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  width: var(--b); height: var(--b); padding: 0; border: 0; background: none; cursor: pointer;
  border-radius: 50%;
  transition: opacity .35s, filter .35s;
}
.orb {
  position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle at 30% 26%, rgb(255 255 255 / 0.95) 0 6%, rgb(255 255 255 / 0.35) 16%, transparent 36%),
    radial-gradient(circle at 70% 78%, rgb(255 148 182 / 0.45) 0 10%, transparent 38%),
    radial-gradient(circle at 50% 50%, var(--soft) 0 46%, color-mix(in srgb, var(--c) 32%, white) 74%, rgb(255 255 255 / 0.55) 100%);
  box-shadow:
    inset 0 0 0 2px rgb(255 255 255 / 0.55),
    inset -12px -16px 30px rgb(255 148 182 / 0.30),
    inset 12px 10px 30px rgb(141 160 251 / 0.30),
    0 18px 38px rgb(40 11 60 / 0.16);
  animation: bob var(--dur, 6s) ease-in-out var(--delay, 0s) infinite;
  transition: transform .45s var(--ease-bubble), box-shadow .3s;
}
.orb::before {
  content: ''; position: absolute; inset: -3px; border-radius: 50%; padding: 3px;
  background: conic-gradient(from 210deg, #ff94b6, #fbc77a, #ffd333, #56c6a7, #8da0fb, #b88ff4, #ff0090, #ff94b6);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: .75;
}
.core {
  position: absolute; inset: 22%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff, var(--cream) 70%);
  display: grid; place-items: center;
  box-shadow: 0 4px 14px rgb(40 11 60 / 0.10);
}
.core svg { width: 46%; height: 46%; stroke: var(--c-strong, var(--c)); }
.bubble:hover .orb, .bubble:focus-visible .orb { transform: scale(1.08); }
@keyframes bob { 0%, 100% { translate: 0 -5px; } 50% { translate: 0 5px; } }

.label {
  position: absolute; left: 0; transform: translateX(-50%);
  width: max-content; max-width: 210px;
  border-radius: 999px; padding: .45rem .9rem; text-align: center;
  background: var(--cream); color: var(--ink);
  font-size: .88rem; font-weight: 500; line-height: 1.15;
  box-shadow: 0 6px 20px rgb(40 11 60 / 0.12);
  pointer-events: none; transition: opacity .35s;
}
.label small { display: block; font-size: .72rem; opacity: .65; font-weight: 500; margin-top: 2px; }
.label .sec { color: #b0006a; }
.date-tag {
  position: absolute; left: 0; transform: translate(-50%, 0);
  font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: rgb(40 11 60 / 0.82); color: var(--cream); border-radius: 999px; padding: 3px 8px;
  white-space: nowrap; pointer-events: none; transition: opacity .35s;
}
.dimmed .bubble, .dimmed .label, .dimmed .date-tag { opacity: .18; filter: grayscale(.6); }
.dimmed .bubble { pointer-events: none; }

.today {
  position: absolute; transform: translate(-50%, -50%);
  display: grid; place-items: center; pointer-events: none;
}
.today .pulse { width: 22px; height: 22px; border-radius: 50%; background: #ff0090; box-shadow: 0 0 0 0 rgb(255 0 144 / .5); animation: pulse 2s infinite; }
.today span { position: absolute; top: 28px; white-space: nowrap; font-weight: 800; font-size: .9rem; background: var(--cream); padding: 4px 10px; border-radius: 999px; }
@keyframes pulse { 70% { box-shadow: 0 0 0 18px rgb(255 0 144 / 0); } 100% { box-shadow: 0 0 0 0 rgb(255 0 144 / 0); } }

/* ---------- Minimap ---------- */
.minimap {
  position: fixed; z-index: 20; left: 24px; right: 24px; bottom: 16px; height: 46px;
  background: rgb(255 250 237 / 0.85); backdrop-filter: blur(8px);
  border-radius: 999px; box-shadow: 0 6px 20px rgb(40 11 60 / 0.10);
  display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px;
}
.mm-rail { position: relative; flex: 1; height: 100%; cursor: pointer; }
.mm-line { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgb(40 11 60 / 0.18); }
.mm-dot { position: absolute; top: 50%; width: 7px; height: 7px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--c); }
.mm-year { position: absolute; top: 3px; transform: translateX(-50%); font-size: .66rem; font-weight: 700; opacity: .7; }
.mm-thumb {
  position: absolute; top: 7px; bottom: 7px; border-radius: 999px;
  background: rgb(40 11 60 / 0.10); border: 2px solid var(--ink); pointer-events: none;
}
.mm-btn { width: 34px; height: 34px; padding: 0; justify-content: center; box-shadow: none; background: var(--lilac); flex: none; }

/* ---------- Detail dialog ---------- */
dialog {
  border: 0; padding: 0; border-radius: 30px; width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 48px); overflow: auto;
  background: var(--cream); color: var(--ink);
  box-shadow: 0 30px 80px rgb(40 11 60 / 0.35);
}
dialog::backdrop { background: rgb(40 11 60 / 0.55); }
.modal-open .bg { visibility: hidden; }
/* While a dialog is open, freeze everything behind it so nothing repaints under the modal. */
.modal-open .orb, .modal-open .hint .arrow, .modal-open .today .pulse { animation-play-state: paused; }
.modal-open .chip, .modal-open .minimap, .modal-open .panel { backdrop-filter: none; }
.modal-open #scroller { pointer-events: none; }
dialog[open] { animation: pop .45s var(--ease-bubble); }
dialog .pill:hover { transform: none; }
@keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.96); } }
.d-head { display: flex; gap: 16px; align-items: center; padding: 24px 24px 8px; }
.d-orb { position: relative; flex: none; width: 76px; height: 76px; }
.d-orb .orb { animation: none; }
.d-meta { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.d-head h2 { margin: 2px 0 0; font-size: 1.55rem; line-height: 1.05; letter-spacing: -.01em; }
.d-body { padding: 8px 24px 24px; }
.d-layer { display: inline-flex; align-items: center; gap: 6px; padding: .3rem .7rem .3rem .35rem; border-radius: 999px; background: var(--soft); font-size: .82rem; font-weight: 700; margin: 6px 0 12px; }
.d-layer .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--c); display: grid; place-items: center; }
.d-layer .dot svg { width: 11px; height: 11px; stroke: #fff; }
.d-body h4 { margin: 14px 0 4px; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; opacity: .65; }
.d-body p { margin: 0; line-height: 1.5; }
.d-num { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--lilac); font-weight: 500; line-height: 1.35; }
.d-num b { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; opacity: .65; margin-bottom: 2px; }
.d-src { margin-top: 14px; font-size: .85rem; word-break: break-word; }
.d-warn { margin-top: 10px; font-size: .8rem; padding: 8px 12px; border-radius: 12px; background: #ffe3ec; color: #7a0040; }
.d-nav { display: flex; justify-content: space-between; gap: 8px; padding: 0 24px 24px; }
.d-close { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; padding: 0; justify-content: center; background: var(--lilac); box-shadow: none; }

.state-mini { display: inline-block; margin-top: 4px; padding: 1px 7px; border-radius: 999px; font-size: .66rem; font-weight: 700; background: var(--ss); color: var(--sc); }
.d-ej { margin: 4px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--ink); color: #f3eaff; font: 500 .78rem/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.d-state { margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--ss); line-height: 1.45; border-left: 4px solid var(--sc); }
.d-state b { display: block; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--sc); margin-bottom: 3px; }
.anatomy { margin: 14px 0 10px; display: grid; gap: 5px; }
.an-row { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 12px; background: var(--soft); border-left: 5px solid var(--c); font-size: .86rem; line-height: 1.25; }
.an-row b { flex: none; min-width: 9.5rem; color: var(--ink); }
.an-row span { color: var(--ink-soft); }
.an-product { background: var(--ink); border-left-color: var(--yellow); }
.an-product b { color: var(--cream); }
.an-product span { color: rgb(255 250 237 / .75); }
.an-side { font-size: .8rem; color: var(--ink-soft); padding: 2px 4px; }
.map { width: 100%; border-collapse: collapse; margin: 4px 0 14px; font-size: .86rem; }
.map td { padding: 7px 8px; border-bottom: 1px solid rgb(40 11 60 / .1); vertical-align: top; line-height: 1.3; }
.map td:first-child { color: var(--ink-soft); width: 52%; }
.map td span { display: block; font-size: .74rem; color: var(--ink-soft); }
.goto { border: 0; padding: 0 0 1px; background: none; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; border-bottom: 2px solid #3fb893; transition: color .2s, border-color .2s; }
.map td span .goto { font-weight: 600; border-bottom-width: 1px; }
.goto:hover { color: #1f8f6c; border-color: #1f8f6c; }
.goto:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 3px; }
.ms.flash .orb { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { transform: scale(1); } 30% { transform: scale(1.18); box-shadow: 0 0 0 10px rgb(255 250 237 / .7); } 100% { transform: scale(1); } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Reduced motion ---------- */
.reduce-motion .orb, .reduce-motion .hint .arrow, .reduce-motion .today .pulse { animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  .orb, .hint .arrow, .today .pulse { animation: none !important; }
}

/* ---------- Small screens ---------- */
@media (max-width: 640px) {
  :root { --header-h: 120px; --footer-h: 66px; }
  header { padding: 14px 16px 0; }
  .legend { left: 16px; right: 16px; top: 74px; }
  .minimap { left: 16px; right: 16px; bottom: 12px; }
  .controls .pill .txt { display: none; }
  .levers { grid-template-columns: 1fr; }
  .panel { padding: 22px 20px; }
  .era { width: 250px; }
  .label { max-width: 160px; font-size: .8rem; }
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="bg-layer" id="bg-stars" data-speed="0.06"></div>
  <div class="bg-layer" id="bg-far" data-speed="0.18"></div>
  <div class="bg-layer" id="bg-near" data-speed="0.45"></div>
</div>

<header>
  <div class="brand">
    <div class="eyebrow">Ciencia de Datos e IA · iTec</div>
    <h1>Cómo avanzó la IA</h1>
  </div>
  <div class="controls">
    <button class="pill" id="btn-motion" aria-pressed="false" title="Reducir movimiento">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/></svg>
      <span class="txt">Reducir movimiento</span>
    </button>
  </div>
</header>

<nav class="legend" id="legend" aria-label="Filtrar por tipo de avance"></nav>

<main id="scroller" tabindex="0" aria-label="Línea temporal. Usá la rueda, arrastrá o las flechas para recorrerla.">
  <div id="track">
    <svg id="line-svg" aria-hidden="true">
      <defs>
        <linearGradient id="lineGrad" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#8c00ff"/>
          <stop offset=".35" stop-color="#ff0090"/>
          <stop offset=".65" stop-color="#fbc77a"/>
          <stop offset="1" stop-color="#56c6a7"/>
        </linearGradient>
        <clipPath id="progressClip"><rect id="progressRect" x="0" y="0" width="0" height="10000"/></clipPath>
      </defs>
      <g id="stems"></g>
      <path id="line-base" fill="none" stroke="rgb(255 250 237 / 0.75)" stroke-width="6" stroke-linecap="round"/>
      <path id="line-progress" fill="none" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round" clip-path="url(#progressClip)"/>
      <g id="dots"></g>
    </svg>
  </div>
</main>

<div class="minimap">
  <div class="mm-rail" id="mm-rail" role="slider" aria-label="Posición en la línea temporal" aria-valuemin="2022" aria-valuemax="2026" tabindex="-1">
    <div class="mm-line"></div>
    <div class="mm-thumb" id="mm-thumb"></div>
  </div>
  <button class="pill mm-btn" id="mm-prev" aria-label="Hito anterior">‹</button>
  <button class="pill mm-btn" id="mm-next" aria-label="Hito siguiente">›</button>
</div>

<dialog id="detail" aria-labelledby="d-title">
  <button class="pill d-close" id="d-close" aria-label="Cerrar">✕</button>
  <div class="d-head">
    <div class="d-orb" id="d-orb"></div>
    <div>
      <div class="d-meta" id="d-meta"></div>
      <h2 id="d-title"></h2>
    </div>
  </div>
  <div class="d-body" id="d-body"></div>
  <div class="d-nav">
    <button class="pill" id="d-prev">‹ Anterior</button>
    <button class="pill" id="d-next">Siguiente ›</button>
  </div>
</dialog>

<script>
/* ============================================================
   Content
   ============================================================ */
const ICONS = {
  chip: '<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  wrench: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  scales: '<path d="M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/>'

/* ============================================================
   Helpers
   ============================================================ */
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fmtDate = (d, long = false) => {
  const [y, m, day] = d.split('-');
  const mon = MONTHS[+m - 1];
  if (long && day) return `${+day} ${mon} ${y}`;
  return `${mon} ${y}`;
};
const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const layerVars = (L) => `--c:${L.c};--soft:${L.soft};--c-strong:${L.cs || L.c}`;
const orbHTML = (L) => `<span class="orb"><span class="core">${svgIcon(L.icon, 2.2)}</span></span>`;
const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
let reducedMotion = reducedMotionQuery.matches;

/* ============================================================
   Build DOM
   ============================================================ */
const scroller = $('#scroller');
const track = $('#track');
const lineSvg = $('#line-svg');
const legend = $('#legend');

// Legend chips (filter by layer)
const chipAll = el('button', 'chip', '<span class="dot" style="--c:var(--ink)"></span>Todas');
chipAll.setAttribute('aria-pressed', 'true');
legend.appendChild(chipAll);
const chips = {};
for (const [key, L] of Object.entries(LAYERS)) {
  const c = el('button', 'chip', `<span class="dot" style="--c:${L.c}">${svgIcon(L.icon, 2.6)}</span>${L.short}`);
  c.setAttribute('aria-pressed', 'false');
  c.title = L.desc;
  c.dataset.layer = key;
  legend.appendChild(c);
  chips[key] = c;
}

/* ============================================================
   Background (parallax layers, low-poly clouds)
   ============================================================ */
function rand(seed) { // deterministic PRNG so the scene is stable across resizes
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
const CLOUD_SHADES = ['#ffffff', '#fbf6fb', '#f4ecf6', '#efe4f1', '#fff4ee', '#f7eef3', '#ebe0ee'];
function cloudSVG(r) {
  // Three low-poly domes, each a fan of triangles with slightly different shades.
  const domes = [
    { cx: 70, cy: 70, rad: 42 }, { cx: 120, cy: 58, rad: 52 }, { cx: 172, cy: 72, rad: 38 }
  ];
  let polys = '';
  for (const d of domes) {
    const steps = 6;
    const pts = [];
    for (let k = 0; k <= steps; k++) {
      const a = Math.PI + (k / steps) * Math.PI;
      const jitter = 0.86 + r() * 0.22;
      pts.push([d.cx + Math.cos(a) * d.rad * jitter, d.cy + Math.sin(a) * d.rad * jitter]);
    }
    const c = [d.cx + (r() - 0.5) * 10, d.cy + 2];
    for (let k = 0; k < steps; k++) {
      const shade = CLOUD_SHADES[Math.floor(r() * CLOUD_SHADES.length)];
      polys += `<polygon points="${c.join(',')} ${pts[k].join(',')} ${pts[k + 1].join(',')}" fill="${shade}" stroke="${shade}" stroke-width=".6"/>`;
    }
  }
  // base slab joining the domes, slightly shaded underside
  polys = `<polygon points="30,74 210,74 196,88 52,88" fill="#e6d9ec"/><polygon points="32,74 44,48 80,32 120,10 160,18 200,46 210,74" fill="#f3ebf5"/>` + polys;
  const shadow = '<ellipse cx="120" cy="90" rx="92" ry="5" fill="rgb(40 11 60 / 0.07)"/>';
  return `<svg viewBox="20 0 210 98" aria-hidden="true">${shadow}${polys}</svg>`;
}

function buildBackground(trackW, vw, vh) {
  const layers = document.querySelectorAll('.bg-layer');
  layers.forEach((layer) => {
    const speed = +layer.dataset.speed;
    const w = vw + (trackW - vw) * speed + 40;
    layer.style.width = w + 'px';
    layer.innerHTML = '';
    if (layer.id === 'bg-stars') {
      const r = rand(7);
      const n = Math.round(w * vh / 9000);
      const frag = document.createDocumentFragment();
      for (let i = 0; i < n; i++) {
        const s = el('span', 'star' + (r() < .15 ? ' warm' : r() < .12 ? ' pink' : ''));
        s.style.left = (r() * w) + 'px';
        s.style.top = (r() * vh) + 'px';
        const size = 2 + r() * 3;
        s.style.width = s.style.height = size + 'px';
        s.style.opacity = (.35 + r() * .55).toFixed(2);
        frag.appendChild(s);
      }
      layer.appendChild(frag);
    } else {
      const near = layer.id === 'bg-near';
      const r = rand(near ? 31 : 13);
      const spacing = near ? 900 : 520;
      for (let x = -100; x < w; x += spacing * (0.7 + r() * 0.6)) {
        const c = el('div', 'cloud', cloudSVG(r));
        const width = near ? 260 + r() * 160 : 140 + r() * 110;
        c.style.width = width + 'px';
        c.style.left = x + 'px';
        const band = near ? [0.12, 0.78] : [0.08, 0.9];
        c.style.top = (band[0] + r() * (band[1] - band[0])) * vh + 'px';
        c.style.opacity = near ? 0.92 : 0.65;
        layer.appendChild(c);
      }
    }
  });
}

/* ============================================================
   Layout
   ============================================================ */
let positions = [];   // x of each milestone
let lineYAt = () => 0;
let trackW = 0;

function layout() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const mobile = vw < 640;
  const headerH = mobile ? 128 : 126;
  const footerH = mobile ? 70 : 76;
  const top = headerH, bottom = vh - footerH;
  const avail = bottom - top;
  const mid = top + avail / 2;
  const b = Math.max(92, Math.min(mobile ? 112 : 148, avail * 0.2));
  document.documentElement.style.setProperty('--b', b + 'px');
  const off = Math.min(avail * 0.27, b * 1.25);   // bubble distance from line
  const amp = Math.min(26, avail * 0.04);
  const gap = mobile ? 200 : 250;
  const eraW = mobile ? 300 : 380;

  lineYAt = (x) => mid + amp * Math.sin(x / 420);

  // Intro
  const introW = Math.min(mobile ? vw - 32 : 640, vw - 32);
  intro.style.width = introW + 'px';
  intro.style.maxHeight = (avail - 8) + 'px';
  intro.style.overflow = 'auto';
  intro.style.left = (mobile ? 16 : Math.max(24, vw * 0.06)) + 'px';
  intro.style.top = mid + 'px';
  let x = parseFloat(intro.style.left) + introW + (mobile ? 120 : 200);

  positions = [];
  let lastEra = -1;
  const eraX = [];
  MILESTONES.forEach((m, i) => {
    if (m.era !== lastEra) {
      x += eraW / 2;
      eraX[m.era] = x;
      x += eraW / 2 + gap * 0.35;
      lastEra = m.era;
    }
    positions.push(x);
    x += gap;
  });
  const todayX = x + 20;
  const endW = Math.min(mobile ? vw - 32 : 600, vw - 32);
  const endLeft = todayX + (mobile ? 90 : 160);
  trackW = endLeft + endW + Math.max(40, vw * 0.08);

  track.style.width = trackW + 'px';
  lineSvg.setAttribute('width', trackW);
  lineSvg.setAttribute('height', vh);
  lineSvg.style.width = trackW + 'px';
  lineSvg.style.height = vh + 'px';

  // Era cards
  ERAS.forEach((_, i) => {
    eraEls[i].style.left = eraX[i] + 'px';
    eraEls[i].style.top = lineYAt(eraX[i]) + 'px';
  });

  // Milestones, stems, dots
  const stems = $('#stems'); stems.innerHTML = '';
  const dots = $('#dots'); dots.innerHTML = '';
  let stemsHTML = '', dotsHTML = '';
  MILESTONES.forEach((m, i) => {
    const px = positions[i];
    const ly = lineYAt(px);
    const up = i % 2 === 0;
    const by = up ? ly - off : ly + off;
    const { wrap, label, tag } = msEls[i];
    wrap.style.left = px + 'px';
    wrap.style.top = by + 'px';
    // label on the outer side of the bubble
    if (up) { label.style.top = 'auto'; label.style.bottom = (b / 2 + 12) + 'px'; }
    else { label.style.bottom = 'auto'; label.style.top = (b / 2 + 12) + 'px'; }
    // date tag sits on the opposite side of the line
    const tagOffset = up ? (ly - by) + 12 : (ly - by) - 34;
    tag.style.top = tagOffset + 'px';
    const L = LAYERS[m.layer];
    const edge = up ? by + b / 2 : by - b / 2;
    stemsHTML += `<line x1="${px}" y1="${edge}" x2="${px}" y2="${ly}" stroke="rgb(255 250 237 / .8)" stroke-width="2" stroke-dasharray="3 5" data-i="${i}"/>`;
    dotsHTML += `<circle cx="${px}" cy="${ly}" r="7" fill="${L.c}" stroke="#fffaed" stroke-width="3" data-i="${i}"/>`;
  });
  stems.innerHTML = stemsHTML;
  dots.innerHTML = dotsHTML;

  // Path
  let d = `M 0 ${lineYAt(0).toFixed(1)}`;
  for (let px = 16; px <= todayX; px += 16) d += ` L ${px} ${lineYAt(px).toFixed(1)}`;
  d += ` L ${todayX} ${lineYAt(todayX).toFixed(1)}`;
  $('#line-base').setAttribute('d', d);
  $('#line-progress').setAttribute('d', d);

  // Today marker and end panel
  todayEl.style.left = todayX + 'px';
  todayEl.style.top = lineYAt(todayX) + 'px';
  endPanel.style.width = endW + 'px';
  endPanel.style.left = endLeft + 'px';
  endPanel.style.top = mid + 'px';
  endPanel.style.maxHeight = (avail - 8) + 'px';
  endPanel.style.overflow = 'auto';

  // Year ghosts in the track
  document.querySelectorAll('.year-ghost').forEach(n => n.remove());
  const yearFirst = {};
  MILESTONES.forEach((m, i) => { const y = m.d.slice(0, 4); if (!(y in yearFirst)) yearFirst[y] = i; });
  Object.entries(yearFirst).forEach(([y, i], k) => {
    const g = el('div', 'year-ghost', y);
    g.style.fontSize = Math.min(200, avail * 0.36) + 'px';
    g.style.left = (positions[i] - gap * 0.3) + 'px';
    g.style.top = (mid + (k % 2 === 0 ? avail * 0.25 : -avail * 0.25)) + 'px';
    track.insertBefore(g, track.firstChild);
  });

  buildBackground(trackW, vw, vh);
  buildMinimap(yearFirst);
  update(true);
}

/* ============================================================
   Minimap
   ============================================================ */
const rail = $('#mm-rail');
const thumb = $('#mm-thumb');
function buildMinimap(yearFirst) {
  rail.querySelectorAll('.mm-dot, .mm-year').forEach(n => n.remove());
  MILESTONES.forEach((m, i) => {
    const dot = el('span', 'mm-dot');
    dot.style.setProperty('--c', LAYERS[m.layer].c);
    dot.style.left = (positions[i] / trackW * 100) + '%';
    rail.appendChild(dot);
  });
  let lastPct = -10;
  for (const [y, i] of Object.entries(yearFirst)) {
    const pct = positions[i] / trackW * 100;
    if (pct - lastPct < 5) continue; // avoid overlapping year labels
    const t = el('span', 'mm-year', y);

}
rail.addEventListener('click', (e) => {

/* ============================================================
   Scrolling: wheel -> horizontal, drag, keys, smooth easing
   ============================================================ */
let target = 0;
let animating = false;
const maxScroll = () => scroller.scrollWidth - scroller.clientWidth;
const clamp = (v) => Math.max(0, Math.min(maxScroll(), v));

function scrollToX(x) {
  target = clamp(x);
  if (reducedMotion) { scroller.scrollLeft = target; return; }
  if (!animating) { animating = true; requestAnimationFrame(tick); }
}
function tick() {
  const cur = scroller.scrollLeft;
  const next = cur + (target - cur) * 0.12;
  if (Math.abs(target - next) < 0.5) { scroller.scrollLeft = target; animating = false; return; }
  scroller.scrollLeft = next;
  requestAnimationFrame(tick);
}

scroller.addEventListener('wheel', (e) => {
  if (e.ctrlKey) return; // let pinch-zoom through
  const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  const scale = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? window.innerWidth : 1;
  e.preventDefault();
  scrollToX((animating ? target : scroller.scrollLeft) + delta * scale * 1.15);
}, { passive: false });

// Mouse drag (touch uses native horizontal scrolling)
let dragStart = null, dragMoved = false;
scroller.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  if (e.target.closest('.panel, .era')) return; // allow text selection in panels
  dragStart = { x: e.clientX, left: scroller.scrollLeft };
  dragMoved = false;
});
window.addEventListener('pointermove', (e) => {
  if (!dragStart) return;
  const dx = e.clientX - dragStart.x;
  if (Math.abs(dx) > 5) { dragMoved = true; scroller.classList.add('dragging'); }
  if (dragMoved) { animating = false; scroller.scrollLeft = dragStart.left - dx; target = scroller.scrollLeft; }
});
window.addEventListener('pointerup', () => {
  if (!dragStart) return;
  dragStart = null;
  scroller.classList.remove('dragging');
  setTimeout(() => { dragMoved = false; }, 0);
});

function currentIndex() {
  const center = scroller.scrollLeft + window.innerWidth / 2;
  let best = 0, bestD = Infinity;
  positions.forEach((p, i) => { const d = Math.abs(p - center); if (d < bestD) { bestD = d; best = i; } });
  return { index: best, dist: bestD };
}
function centerOn(i, smooth = true) {
  const x = positions[i] - window.innerWidth / 2;
  if (smooth) scrollToX(x); else { target = clamp(x); scroller.scrollLeft = target; }
}
function step(dir) {
  const { index, dist } = currentIndex();
  const visibleOrder = MILESTONES.map((_, i) => i).filter(i => !isDimmed(i));
  if (!visibleOrder.length) return;
  const center = scroller.scrollLeft + window.innerWidth / 2;
  let nextI;
  if (dir > 0) nextI = visibleOrder.find(i => positions[i] > center + 5);
  else nextI = [...visibleOrder].reverse().find(i => positions[i] < center - 5);
  if (nextI === undefined) {
    if (dir > 0) scrollToX(maxScroll()); else scrollToX(0);
    return;
  }
  centerOn(nextI);
}
$('#mm-prev').addEventListener('click', () => step(-1));
$('#mm-next').addEventListener('click', () => step(1));
window.addEventListener('keydown', (e) => {
  if (detail.open) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Home') { e.preventDefault(); scrollToX(0); }
  else if (e.key === 'End') { e.preventDefault(); scrollToX(maxScroll()); }
});

/* ============================================================
   Per-frame updates on scroll: parallax, progress line, minimap
   ============================================================ */
const bgLayers = [...document.querySelectorAll('.bg-layer')];
let ticking = false;
function update(force) {
  const sl = scroller.scrollLeft;
  const vw = window.innerWidth;
  const progress = maxScroll() > 0 ? sl / maxScroll() : 0;
  bgLayers.forEach(l => { l.style.transform = `translate3d(${-sl * +l.dataset.speed}px,0,0)`; });
  document.body.style.backgroundPosition = `${progress * 100}% 50%`;
  $('#progressRect').setAttribute('width', sl + vw * 0.5);
  thumb.style.left = (sl / trackW * 100) + '%';
  thumb.style.width = (vw / trackW * 100) + '%';
  rail.setAttribute('aria-valuenow', String(2022 + Math.round(progress * 4)));
  if (!animating && !dragStart && !force) target = sl;
}
scroller.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { update(); ticking = false; });
});

/* ============================================================
   Filter by layer
   ============================================================ */
let activeLayer = null;
const isDimmed = (i) => activeLayer && MILESTONES[i].layer !== activeLayer;
function setFilter(layer) {
  activeLayer = layer;
  chipAll.setAttribute('aria-pressed', String(!layer));

  legend.classList.toggle('filtering', !!layer);
  msEls.forEach((m, i) => {
    const dim = isDimmed(i);
    m.wrap.classList.toggle('dimmed', dim);
    m.btn.tabIndex = dim ? -1 : 0;
  });
  document.querySelectorAll('#dots circle, #stems line').forEach(n => {
    n.style.opacity = isDimmed(+n.dataset.i) ? .25 : 1;
  });
  document.querySelectorAll('.mm-dot').forEach((n, i) => { n.style.opacity = isDimmed(i) ? .2 : 1; });
}
chipAll.addEventListener('click', () => setFilter(null));
for (const [k, c] of Object.entries(chips)) c.addEventListener('click', () => setFilter(activeLayer === k ? null : k));

/* ============================================================
   Reduced motion toggle
   ============================================================ */
const btnMotion = $('#btn-motion');
function applyMotion() {
  document.documentElement.classList.toggle('reduce-motion', reducedMotion);
  btnMotion.setAttribute('aria-pressed', String(reducedMotion));
}
btnMotion.addEventListener('click', () => {
  reducedMotion = !reducedMotion;
  try { localStorage.setItem('ia-timeline-reduce-motion', reducedMotion ? '1' : '0'); } catch {}
  applyMotion();
});
try {
  const saved = localStorage.getItem('ia-timeline-reduce-motion');
  if (saved !== null) reducedMotion = saved === '1';
} catch {}
applyMotion();

/* ============================================================
   Init
   ============================================================ */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const ratio = maxScroll() > 0 ? scroller.scrollLeft / maxScroll() : 0;
    layout();
    scroller.scrollLeft = target = ratio * maxScroll();
    update(true);
  }, 120);
});
layout();
scroller.focus({ preventScroll: true });
</script>
</body>
</html>
